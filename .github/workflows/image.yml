name: image

# 构建生产镜像并推送到 GHCR。服务器内存小，不在服务器上编译，只拉取这里产出的镜像。
# 镜像标签：sha-<7位提交号>（部署时固定使用）与分支名 main。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.ref }}-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        run: |
          echo "镜像：${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
